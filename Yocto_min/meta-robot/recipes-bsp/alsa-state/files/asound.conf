# Salida por el adaptador USB (única tarjeta: card 0). dmix permite que la música
# y las notificaciones (dos procesos mpg123) suenen a la vez.
pcm.!default {
    type plug
    slave.pcm "mezcla"
}

pcm.mezcla {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        period_size 1024
        buffer_size 4096
    }
}

ctl.!default {
    type hw
    card 0
}
