#
# This file is your local configuration file and is where all local user settings
# are placed. 
#
# The distribution setting controls which policy settings are used as defaults.
# The default value is fine for general Yocto project use, at least initially.
# Ultimately when creating custom policy, people will likely end up subclassing 
# these defaults.
#
DISTRO ?= "poky"

#--------------OJO---------------------
#Este es solo para desarrollo es para entrar a la rasp sin contraseña
#Quitar cuando tengamos el acceso a usuario con llave
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

#
# Additional image features
#
# The following is a list of additional classes to use when building images which
# enable extra features. Some available options which can be included in this variable
# are:
#   - 'buildstats' collect build statistics
USER_CLASSES ?= "buildstats"
#
# Supported values are auto, gnome, xfce, rxvt, screen, konsole (KDE 3.x only), none
# Note: currently, Konsole support only works for KDE 3.x due to the way
# newer Konsole versions behave
#OE_TERMINAL = "auto"
# By default disable interactive patch resolution (tasks will just fail instead):
PATCHRESOLVE = "noop"

#
# Disk Space Monitoring during the build
#
# Monitor the disk space during the build. If there is less that 1GB of space or less
# than 100K inodes in any key build location (TMPDIR, DL_DIR, SSTATE_DIR), gracefully
# shutdown the build. If there is less than 100MB or 1K inodes, perform a hard halt
# of the build. The reason for this is that running completely out of space can corrupt
# files and damages the build in ways which may not be easily recoverable.
# It's necessary to monitor /tmp, if there is no space left the build will fail
# with very exotic errors.
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

# Qemu configuration
#PACKAGECONFIG:append:pn-qemu-system-native = " sdl"

#SO de 64bits
MACHINE ?= "raspberrypi4-64"

#Borra aoutmáticamente los directorios de las recetas luego de usarlas
INHERIT += "rm_work"

#Desde donde estamos generando la imagen, evita el warning de los SO host probados
SANITY_TESTED_DISTROS:append = " Ubuntu-24.04"

#Esto determina la cantidad de tareas a procesar en paralelo/threads
BB_NUMBER_THREADS = "5"
PARALLEL_MAKE = "-j 5"

#Para la inclusión de algunos paquetes que usamos
LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"
LICENSE_FLAGS_ACCEPTED:append = " commercial"

#Ayuda para las descargas de cosas en repos de git
BB_GIT_SHALLOW = "1"

#0 explicitamente le dice que tiene acceso a internet
BB_NO_NETWORK = "0"
#Empaqueta fuentes, por default es 0, hay que activarlo
BB_GENERATE_MIRROR_TARBALLS = "1"

# El jack analógico (bcm2835 Headphones) sí se compila, pero el módulo no queda
# instalado en el rootfs ni se carga solo salvo que se pida explícitamente:
IMAGE_INSTALL:append = " alsa-lib mpg123 libgpiod systemd-analyze metricas logica libroombateca servidor kernel-module-snd-bcm2835"
# Tailscale (solo desarrollo, eliminar después): receta en meta-robot/recipes-connectivity/tailscale
#IMAGE_INSTALL:append = " tailscale"

KERNEL_MODULE_AUTOLOAD:append = " snd-bcm2835"
# PWM por hardware de los motores: canal 0 en GPIO12 (ENA), canal 1 en GPIO13 (ENB).
# El .dtbo no viene en la lista por defecto de meta-raspberrypi y el driver es módulo.
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/pwm-2chan.dtbo"

# dtparam=audio=on habilita el jack analógico; meta-raspberrypi solo lo agrega para raspberrypi3-64.
RPI_EXTRA_CONFIG = "dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4\ndtparam=audio=on"
# Sin audio por HDMI: así el jack analógico queda como tarjeta ALSA por defecto (card 0)
VC4DTBO = "vc4-kms-v3d,noaudio"

#Para los controladores PWM
IMAGE_INSTALL:append = " kernel-module-pwm-bcm2835"
KERNEL_MODULE_AUTOLOAD:append = " pwm-bcm2835"
EXTRA_IMAGE_FEATURES:append = " ssh-server-dropbear"

#se ocupa para los .service
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

# WiFi integrado (wlan0). La red se configura en la Pi con wpa_passphrase, ver Yocto/README.md
IMAGE_INSTALL:append = " kernel-module-brcmfmac kernel-module-brcmfmac-wcc linux-firmware-rpidistro-bcm43455 wireless-regdb-static wifi-config"

# Sin teclado ni pantalla: fuera la consola virtual (kbd) y la base de datos de hardware de udev
PACKAGECONFIG:remove:pn-systemd = "vconsole"
BAD_RECOMMENDATIONS += "udev-hwdb"
