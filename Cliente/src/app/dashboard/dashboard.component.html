<div class="dashboard">

  <!-- Estado de conexion con el servidor (temporal para pruebas) -->
  <div class="connection-bar">Servidor: {{ connectionStatus() }}</div>

  <!-- Columna izquierda -->
  <div class="left-column">

    <!-- Fila superior: botón de modo + lecturas de sensores -->
    <div class="status-row">
      <button
        type="button"
        class="modo-btn"
        [class.mode-auto]="mode === 'AUTO'"
        [class.mode-manual]="mode === 'MANUAL'"
        (click)="toggleMode()"
        [disabled]="!powered || connectionStatus() !== 'conectado'"
        [attr.aria-label]="'Modo actual ' + mode">
        {{ mode }}
      </button>

      @for (sensor of sensors; track sensor.id) {
        <div class="sensor-box" [class.obstacle]="sensor.obstacle">
          <span class="sensor-label">Sensor {{ sensor.id }}</span>
          <span class="sensor-value">{{ sensor.distance === null ? '---' : sensor.distance + ' cm' }}</span>
        </div>
      }
    </div>

    <!-- Panel de audio -->
    <app-audio-panel></app-audio-panel>

    <!-- Mapa en tiempo real -->
    <app-map-view [width]="map.width" [height]="map.height" [cells]="map.cells"></app-map-view>
  </div>

  <!-- Columna derecha -->
  <div class="right-column">
    <mat-card appearance="outlined" class="control-card">
      <mat-card-content>
        <mat-card-title>Joystick</mat-card-title>
        <controll-movement-joystick
          [disabled]="!powered || mode !== 'MANUAL'"
          (joystickDirection)="onDirectionChange($event)">
        </controll-movement-joystick>
      </mat-card-content>
    </mat-card>

    <div class="velocity">
      <span class="velocity-label">Velocidad</span>
      <div class="velocity-slider">
        <mat-slider
          [min]="0"
          [max]="1000"
          [step]="1"
          [discrete]="true"
          [disabled]="!powered || mode !== 'MANUAL'">
          <input matSliderThumb [value]="speed" (valueChange)="onSpeedChange($event)">
        </mat-slider>
      </div>
      <span class="velocity-value">{{ speed }}</span>
    </div>
  </div>
</div>
