<mat-card class="example-card" appearance="outlined" style="width: 100%;">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"></div>
    <mat-card-title>{{ titulo }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      {{ descripcion }}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <mat-slide-toggle
      (change)="onEnableLoopChange($event)"
      [checked]="enableMode">
      @if (enableMode) {
        On
      }
      @else {
        Off
      }
    </mat-slide-toggle>
    <div style="display: flex; justify-content: center; margin-left: 10px;">
      <mat-slider
        style="width: 75%;"
        [disabled]="disabledLoopMode"
        [max]="max"
        [min]="min"
        [step]="step"
        [discrete]="thumbLabel"
        [showTickMarks]="showTicks"
        [displayWith]="formatLabel">
        <input matSliderThumb
            (valueChange)="onSliderChange($event)">
      </mat-slider>
    </div>
  </mat-card-actions>
</mat-card>
